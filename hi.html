<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style id="gate-hide">html{visibility:hidden}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#0e1226;
    --paper:#f6ecd9;
    --beam:#ffd9a0;
    --mute:#9aa0c0;
    --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { min-height:100%; }
  body {
    min-height:100dvh;
    background:var(--night);
    color:var(--paper);
    font-family:var(--body);
    font-size:16px;
    display:grid;
    place-items:center;
    padding:24px;
    overflow-x:hidden;
  }
  .stars {
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .star {
    position:absolute;
    width:var(--size);
    height:var(--size);
    left:var(--x);
    top:var(--y);
    background:white;
    border-radius:50%;
    opacity:var(--opacity);
    box-shadow:0 0 6px #ffffffaa;
    animation:twinkle var(--twinkle-duration) ease-in-out infinite;
    animation-delay:var(--delay);
  }
  @keyframes twinkle {
    0%,100% { opacity:var(--opacity); transform:scale(1); }
    50% { opacity:.15; transform:scale(.5); }
  }
  .beam {
    position:fixed;
    left:50%;
    bottom:-10vh;
    width:140vmax;
    height:90vh;
    transform:translateX(-50%);
    pointer-events:none;
    background:conic-gradient(from 160deg at 50% 100%,transparent 0deg,#ffd9a022 20deg,#ffd9a00d 40deg,transparent 40deg);
    animation:flicker 5s infinite steps(1);
    z-index:0;
  }
  @keyframes flicker {
    0%,100% { opacity:1; }
    7% { opacity:.7; }
    9% { opacity:1; }
    52% { opacity:.85; }
    54% { opacity:1; }
  }
  .message-box {
    position:relative;
    z-index:1;
    width:min(100%,520px);
  }
  textarea {
    display:block;
    width:100%;
    min-height:120px;
    resize:vertical;
    padding:14px 16px;
    border:1px solid #ffffff35;
    border-radius:14px;
    background:#0e1226eF;
    color:var(--paper);
    font:inherit;
    outline:none;
  }
  textarea::placeholder { color:#9aa0c0; }
  textarea:focus { border-color:var(--beam); }
  button {
    display:block;
    margin:12px 0 0 auto;
    padding:11px 22px;
    border:0;
    border-radius:999px;
    background:var(--beam);
    color:var(--night);
    font:inherit;
    font-weight:500;
    cursor:pointer;
  }
  button:disabled { opacity:.6; cursor:wait; }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation:none!important; transition:none!important; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="beam"></div>

<main class="message-box">
  <form id="messageForm">
    <textarea id="note" maxlength="1000" placeholder="Napisz wiadomość..." required></textarea>
    <button id="sendButton" type="submit">Wyślij</button>
  </form>
</main>

<script>
  /* ============ USTAWIENIA ============ */
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1567981536144523294/tr_7zYs6x0IIwg6hK-iJtj9AdY1g_Mf8ykge-SZ0bQ7S419gq5kHPB14QBJ1NVqrC6dI";
  const OPEN_HOUR = 23;
  const CLOSE_HOUR = 4;
  const TZ = "Europe/Warsaw";
  /* ==================================== */

  const SID = Math.random().toString(36).slice(2, 8);
  const $ = selector => document.querySelector(selector);

  function nowPL() {
    return new Date().toLocaleString("pl-PL", {
      timeZone: TZ, dateStyle: "short", timeStyle: "medium"
    });
  }

  function hourPL() {
    return parseInt(new Intl.DateTimeFormat("en-GB", {
      timeZone: TZ, hour: "2-digit", hourCycle: "h23"
    }).format(new Date()), 10);
  }

  function isOpen() {
    const hour = hourPL();
    return OPEN_HOUR < CLOSE_HOUR
      ? hour >= OPEN_HOUR && hour < CLOSE_HOUR
      : hour >= OPEN_HOUR || hour < CLOSE_HOUR;
  }

  function fmtDur(ms) {
    const seconds = Math.round(ms / 1000);
    return seconds < 60
      ? seconds + "s"
      : Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
  }

  let userIP = "nieznane";
  const ipReady = (async () => {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      const response = await fetch("https://api.ipify.org?format=json", {
        signal: controller.signal
      });
      clearTimeout(timeout);
      userIP = (await response.json()).ip || "nieznane";
    } catch (error) {
      // Brak sieci lub blokada usługi IP.
    }
    return userIP;
  })();

  const cut = (value, max = 1000) => {
    value = String(value ?? "").trim();
    return value ? value.slice(0, max) : "—";
  };

  async function log(title, fields = [], color = 0xffd9a0) {
    const ip = await ipReady;
    const embed = {
      title,
      color,
      fields: [
        ...fields.map(field => ({
          name: field[0],
          value: cut(field[1]),
          inline: field[2] !== false
        })),
        { name: "IP", value: cut(ip), inline: true },
        { name: "Godzina", value: nowPL(), inline: true }
      ],
      footer: { text: "sesja " + SID }
    };

    try {
      await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          allowed_mentions: { parse: [] },
          embeds: [embed]
        }),
        keepalive: true
      });
    } catch (error) {
      console.error("Nie udało się wysłać logu:", error);
    }
  }

  /* ---------- BLOKADA GODZINOWA ---------- */
  if (!isOpen()) {
    log("⛔ Próba wejścia przed czasem", [
      ["Godzina PL", hourPL() + ":xx"],
      ["Przeglądarka", navigator.userAgent, false]
    ], 0xff4d5e);

    // Daj logowi chwilę na wysłanie, a następnie przekieruj na stronę informacyjną.
    setTimeout(() => location.replace("tooearly.html"), 1200);
  } else {
    $("#gate-hide").remove();

    const pageSince = Date.now();
    let hiddenAt = 0;
    let sent = false;

    log("🟢 Weszła na stronę", [
      ["Godzina otwarcia", OPEN_HOUR + ":00–" + CLOSE_HOUR + ":00"],
      ["Ekran/okno", innerWidth + "×" + innerHeight],
      ["Język", navigator.language],
      ["Przeglądarka", navigator.userAgent, false],
      ["Skąd przyszła", document.referrer || "bezpośrednio"]
    ], 0x57f287);

    $("#messageForm").addEventListener("submit", async event => {
      event.preventDefault();
      const message = $("#note").value.trim();
      if (!message || sent) return;

      const button = $("#sendButton");
      button.disabled = true;
      button.textContent = "Wysyłanie...";

      await log("💬 Wysłano wiadomość", [
        ["Wiadomość", message, false],
        ["Czas od wejścia na stronę", fmtDur(Date.now() - pageSince)]
      ], 0x57f287);

      sent = true;
      $("#note").value = "";
      button.textContent = "Wysłano";
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        hiddenAt = Date.now();
        log("👋 Opuściła kartę / zamknęła stronę", [
          ["Czas od wejścia", fmtDur(Date.now() - pageSince)],
          ["Niewysłana wiadomość", !sent ? ($("#note").value.trim() || "—") : "—", false]
        ], 0xfee75c);
      } else if (hiddenAt) {
        log("👀 Wróciła na stronę", [
          ["Nie było jej", fmtDur(Date.now() - hiddenAt)],
          ["Czas od wejścia", fmtDur(Date.now() - pageSince)]
        ], 0x57f287);
        hiddenAt = 0;
      }
    });
  }

  /* ---------- GWIAZDKI ---------- */
  const STAR_CONFIG = {
    count: 200,
    minSize: 1,
    maxSize: 3,
    minOpacity: 0.3,
    maxOpacity: 1,
    twinkleSpeed: 3,
    twinkleRandomness: 4
  };

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function createStars() {
    const container = $("#stars");
    for (let i = 0; i < STAR_CONFIG.count; i++) {
      const star = document.createElement("div");
      star.className = "star";

      const size = random(STAR_CONFIG.minSize, STAR_CONFIG.maxSize);
      const opacity = random(STAR_CONFIG.minOpacity, STAR_CONFIG.maxOpacity);
      const duration = random(
        STAR_CONFIG.twinkleSpeed,
        STAR_CONFIG.twinkleSpeed + STAR_CONFIG.twinkleRandomness
      );

      star.style.setProperty("--x", random(0, 100) + "%");
      star.style.setProperty("--y", random(0, 100) + "%");
      star.style.setProperty("--size", size + "px");
      star.style.setProperty("--opacity", opacity);
      star.style.setProperty("--twinkle-duration", duration + "s");
      star.style.setProperty("--delay", random(0, duration) + "s");

      container.appendChild(star);
    }
  }

  if (isOpen()) createStars();
</script>
</body>
</html>
