<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Za wcześnie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0e1226; --beam:#ffd9a0; --paper:#f6ecd9; --tail:#ff4d5e; --mute:#9aa0c0;
    --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
    --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--night);
    color:var(--paper);
    font-family:var(--body);
    overflow:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .stars{
    position:fixed;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),
      radial-gradient(1px 1px at 78% 12%,#fffc 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 40% 8%,#fffd 50%,transparent 51%),
      radial-gradient(1px 1px at 90% 40%,#fffb 50%,transparent 51%),
      radial-gradient(1px 1px at 22% 55%,#fffb 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 62% 30%,#fffd 50%,transparent 51%),
      radial-gradient(1px 1px at 8% 80%,#fffb 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 72%,#fffd 50%,transparent 51%),
      radial-gradient(1px 1px at 50% 62%,#fff9 50%,transparent 51%),
      radial-gradient(1px 1px at 30% 35%,#fff9 50%,transparent 51%);
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.55}to{opacity:1}}

  .beam{
    position:fixed;left:50%;bottom:-10vh;width:140vmax;height:90vh;transform:translateX(-50%);pointer-events:none;
    background:conic-gradient(from 160deg at 50% 100%,transparent 0deg,#ffd9a022 20deg,#ffd9a00d 40deg,transparent 40deg);
    animation:flicker 5s infinite steps(1);
  }
  @keyframes flicker{0%,100%{opacity:1}7%{opacity:.7}9%{opacity:1}52%{opacity:.85}54%{opacity:1}}

  main{
    position:relative;min-height:100dvh;display:grid;place-items:center;
    padding:28px 22px;text-align:center;
  }
  .wrap{max-width:560px}

  .tag{
    display:inline-block;background:var(--tail);color:#fff;
    font-family:var(--display);font-weight:800;font-size:18px;
    padding:3px 14px;border-radius:8px;transform:rotate(-3deg);margin-bottom:22px;
  }

  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(34px,9.5vw,60px);line-height:1.08;letter-spacing:-.02em;
  }
  h1 em{font-style:normal;color:var(--beam)}

  .sub{margin-top:18px;color:var(--mute);font-size:16px}

  /* odliczanie */
  .countdown{margin-top:34px}
  .countdown .label{
    font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;
  }
  .clock{
    display:inline-block;
    font-family:var(--display);font-weight:800;font-size:clamp(46px,13vw,76px);
    font-variant-numeric:tabular-nums;
    color:var(--beam);text-shadow:0 0 36px #ffd9a055;
    animation:pulse 3s ease-in-out infinite;
  }
  .units{
    display:flex;justify-content:center;gap:clamp(24px,8vw,46px);
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:2px;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="beam"></div>

<main>
  <div class="wrap">
    <span class="tag">⏰ za wcześnie</span>
    <h1>Nienienie cwaniaczku, <em>po 23</em> :P</h1>

    <div class="countdown">
      <div class="label">Do 23:00 zostało</div>
      <div class="clock" id="clock" aria-live="off">--:--:--</div>
      <div class="units"><span>godz</span><span>min</span><span>sek</span></div>
    </div>
  </div>
</main>

<script>
  /* ============ USTAWIENIA ============ */
  const MAIN_URL   = "hi.html";       
  const OPEN_HOUR  = 12; 
  const CLOSE_HOUR = 5;
  const TZ         = "Europe/Warsaw";
  /* ==================================== */

  const fmt = new Intl.DateTimeFormat("en-GB", {
    timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
  });
  const pad = n => String(n).padStart(2, "0");
  const clock = document.getElementById("clock");

  function secondsLeft(){
    const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value]));
    const h = +p.hour, m = +p.minute, s = +p.second;
    if (h >= OPEN_HOUR || h < CLOSE_HOUR) return 0;
    return OPEN_HOUR * 3600 - (h * 3600 + m * 60 + s);
  }

  let redirecting = false;
  function tick(){
    const left = secondsLeft();
    if (left <= 0) {
      clock.textContent = "00:00:00";
      if (!redirecting) { redirecting = true; setTimeout(() => location.replace(MAIN_URL), 800); }
      return;
    }
    const h = Math.floor(left / 3600);
    const m = Math.floor((left % 3600) / 60);
    const s = left % 60;
    clock.textContent = pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
